<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Production Data</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Production Planning Platform</h1>
        <p>Manufacturing Data</p>
    </header>

    <main>

        <h2>Sample Manufacturing Data</h2>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Material</th>
                    <th>Machine</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Product A</td>
                    <td>100</td>
                    <td>Steel</td>
                    <td>Machine 1</td>
                </tr>

                <tr>
                    <td>Product B</td>
                    <td>150</td>
                    <td>Plastic</td>
                    <td>Machine 2</td>
                </tr>

                <tr>
                    <td>Product C</td>
                    <td>75</td>
                    <td>Aluminium</td>
                    <td>Machine 3</td>
                </tr>

            </tbody>
        </table>

    </main>

</body>
</html>
