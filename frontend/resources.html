<!DOCTYPE html>
<html>
<head>
    <title>Manufacturing Resources</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Production Planning & Digital Factory</h1>
    <p>Manufacturing Resource Monitoring</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="orders.html">Production Orders</a>
    <a href="inventory.html">Inventory</a>
    <a href="resources.html">Resources</a>
    <a href="reports.html">Reports</a>
</nav>

<main>

    <h2>Manufacturing Resources</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Resource</th>
                <th>Utilization (%)</th>
                <th>Availability</th>
            </tr>
        </thead>

        <tbody id="resourcesTable">
            <tr>
                <td colspan="4">Loading...</td>
            </tr>
        </tbody>
    </table>

</main>

<script>

async function loadResources() {

    const response =
        await fetch("http://localhost:5001/api/resources");

    const resources = await response.json();

    const table =
        document.getElementById("resourcesTable");

    table.innerHTML = "";

    resources.forEach(resource => {

        const row = `
            <tr>
                <td>${resource.id}</td>
                <td>${resource.resource_name}</td>
                <td>${resource.utilization}</td>
                <td>${resource.availability}</td>
            </tr>
        `;

        table.innerHTML += row;
    });
}

loadResources();

</script>

</body>
</html>
