<!DOCTYPE html>
<html>
<head>
    <title>Operational Reports</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Production Planning & Digital Factory</h1>
    <p>Operational Reports</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="orders.html">Production Orders</a>
    <a href="inventory.html">Inventory</a>
    <a href="resources.html">Resources</a>
    <a href="reports.html">Reports</a>
</nav>

<main>

    <h2>Factory Performance Reports</h2>

    <div class="cards">

        <div class="card">
            <h3>Total Orders</h3>
            <p id="totalOrders">Loading...</p>
        </div>

        <div class="card">
            <h3>Active Orders</h3>
            <p id="activeOrders">Loading...</p>
        </div>

        <div class="card">
            <h3>Low Stock Items</h3>
            <p id="lowStock">Loading...</p>
        </div>

    </div>

    <section class="panel">

        <h2>Resource Performance</h2>

        <table>

            <thead>
                <tr>
                    <th>Resource</th>
                    <th>Utilization</th>
                    <th>Availability</th>
                </tr>
            </thead>

            <tbody id="resourceReport">
                <tr>
                    <td colspan="3">Loading...</td>
                </tr>
            </tbody>

        </table>

    </section>

</main>

<script>

async function loadReports() {

    const ordersResponse =
        await fetch("http://localhost:5000/api/orders");

    const orders =
        await ordersResponse.json();

    const inventoryResponse =
        await fetch("http://localhost:5000/api/inventory");

    const inventory =
        await inventoryResponse.json();

    const resourcesResponse =
        await fetch("http://localhost:5000/api/resources");

    const resources =
        await resourcesResponse.json();


    document.getElementById("totalOrders").innerText =
        orders.length;


    const active =
        orders.filter(order =>
            order.status === "In Progress"
        ).length;

    document.getElementById("activeOrders").innerText =
        active;


    const lowStock =
        inventory.filter(item =>
            item.status === "REORDER"
        ).length;

    document.getElementById("lowStock").innerText =
        lowStock;


    const table =
        document.getElementById("resourceReport");

    table.innerHTML = "";

    resources.forEach(resource => {

        table.innerHTML += `
            <tr>
                <td>${resource.resource_name}</td>
                <td>${resource.utilization}%</td>
                <td>${resource.availability}</td>
            </tr>
        `;

    });

}

loadReports();

</script>

</body>
</html>
