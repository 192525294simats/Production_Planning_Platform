<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bottleneck Detection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Production Planning Platform</h1>
        <p>Bottleneck Detection</p>
    </header>

    <main>

        <h2>Production Bottleneck Detection</h2>

        <div class="bottleneck-form">

            <label for="requiredMaterial">
                Required Material (kg)
            </label>

            <input
                type="number"
                id="requiredMaterial"
                placeholder="Example: 600"
            >

            <label for="availableMaterial">
                Available Material (kg)
            </label>

            <input
                type="number"
                id="availableMaterial"
                value="500"
            >

            <label for="machineStatus">
                Machine Status
            </label>

            <select id="machineStatus">
                <option value="Available">Available</option>
                <option value="Unavailable">Unavailable</option>
            </select>

            <label for="requiredWorkers">
                Required Workers
            </label>

            <input
                type="number"
                id="requiredWorkers"
                placeholder="Example: 5"
            >

            <label for="availableWorkers">
                Available Workers
            </label>

            <input
                type="number"
                id="availableWorkers"
                value="4"
            >

            <button onclick="detectBottleneck()">
                Detect Bottleneck
            </button>

            <div id="bottleneckResult"></div>

        </div>

    </main>

    <script src="bottleneck.js"></script>

</body>
</html>
