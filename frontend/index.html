<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Production Planning Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Production Planning Platform</h1>
        <p>Digital Factory Operations Dashboard</p>
    </header>

    <nav>
        <button>Production</button>
        <button>Inventory</button>
        <button>Resources</button>
        <button>Workforce</button>
        <button>Work Orders</button>
        <button>Reports</button>
    </nav>

    <main>

        <h2>Production Status</h2>

        <div class="dashboard">

            <div class="card">
                <h3>Scheduled</h3>
                <p>25</p>
            </div>

            <div class="card">
                <h3>In Progress</h3>
                <p>12</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p>18</p>
            </div>

            <div class="card">
                <h3>Delayed</h3>
                <p>3</p>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
