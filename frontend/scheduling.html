<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Production Scheduling</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Production Planning Platform</h1>
        <p>Production Scheduling</p>
    </header>

    <main>

        <h2>Create Production Schedule</h2>

        <div class="schedule-form">

            <label for="product">Product</label>
            <select id="product">
                <option>Product A</option>
                <option>Product B</option>
                <option>Product C</option>
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" placeholder="Enter quantity">

            <label for="startDate">Start Date</label>
            <input type="date" id="startDate">

            <label for="endDate">End Date</label>
            <input type="date" id="endDate">

            <label for="machine">Machine</label>
            <select id="machine">
                <option>Machine 1</option>
                <option>Machine 2</option>
                <option>Machine 3</option>
            </select>

            <label for="workers">Workers</label>
            <input type="number" id="workers" placeholder="Number of workers">

            <label for="priority">Priority</label>
            <select id="priority">
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
            </select>

            <button onclick="createSchedule()">
                Create Schedule
            </button>

            <div id="scheduleResult"></div>

        </div>

    </main>

    <script src="scheduling.js"></script>

</body>
</html>
